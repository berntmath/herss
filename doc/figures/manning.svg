<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="20" font-weight="bold">Manning channel (trapezoidal section)</text>
  <line x1="490" y1="45" x2="490" y2="395" stroke="#bbb" stroke-dasharray="4 4"/>

  <!-- ================= LEFT: CROSS-SECTION ================= -->
  <text x="240" y="60" text-anchor="middle" font-size="16" font-weight="bold">Cross-section</text>

  <!-- ground -->
  <polygon points="20,240 50,240 170,320 310,320 430,240 460,240 460,380 20,380" fill="#e6d5b0" stroke="#8a7a50"/>
  <!-- water -->
  <polygon points="50,240 430,240 310,320 170,320" fill="#a9d4f5"/>
  <line x1="50" y1="240" x2="430" y2="240" stroke="#2a74b8" stroke-width="2"/>
  <!-- wetted perimeter -->
  <polyline points="50,240 170,320 310,320 430,240" fill="none" stroke="#0b3d91" stroke-width="4"/>

  <!-- top width T -->
  <line x1="50" y1="215" x2="430" y2="215" stroke="#222" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="50" y1="208" x2="50" y2="240" stroke="#222" stroke-dasharray="3 3"/>
  <line x1="430" y1="208" x2="430" y2="240" stroke="#222" stroke-dasharray="3 3"/>
  <text x="240" y="207" text-anchor="middle">T = b + 2·z·d  (water surface width)</text>

  <!-- depth d -->
  <line x1="200" y1="240" x2="200" y2="320" stroke="#222" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="208" y="285" font-style="italic">d</text>

  <!-- area -->
  <text x="285" y="282" text-anchor="middle">A = d(b + z·d)</text>

  <!-- bottom width b -->
  <line x1="170" y1="345" x2="310" y2="345" stroke="#222" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="170" y1="320" x2="170" y2="352" stroke="#222" stroke-dasharray="3 3"/>
  <line x1="310" y1="320" x2="310" y2="352" stroke="#222" stroke-dasharray="3 3"/>
  <text x="240" y="366" text-anchor="middle"><tspan font-style="italic">b</tspan> = bottom width (MANNING_BOTTOM_WIDTH_M)</text>

  <!-- side slope triangle -->
  <line x1="310" y1="320" x2="430" y2="320" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="430" y1="320" x2="430" y2="240" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="370" y="338" text-anchor="middle" fill="#c0392b">z·d  (H)</text>
  <text x="438" y="285" fill="#c0392b">d  (V)</text>
  <text x="372" y="266" text-anchor="middle" fill="#c0392b" font-size="13" transform="rotate(-34 372 266)">side slope z = H : V</text>

  <!-- legend, left -->
  <line x1="20" y1="404" x2="50" y2="404" stroke="#0b3d91" stroke-width="4"/>
  <text x="58" y="409">wetted perimeter  P = b + 2d√(1+z²)</text>
  <text x="58" y="430">hydraulic radius  R = A / P</text>

  <!-- ================= RIGHT: LONGITUDINAL PROFILE ================= -->
  <text x="730" y="60" text-anchor="middle" font-size="16" font-weight="bold">Longitudinal profile</text>

  <!-- ground -->
  <polygon points="540,250 900,340 900,380 540,380" fill="#e6d5b0" stroke="#8a7a50"/>
  <!-- water -->
  <polygon points="540,220 900,310 900,340 540,250" fill="#a9d4f5"/>
  <line x1="540" y1="220" x2="900" y2="310" stroke="#2a74b8" stroke-width="2"/>
  <line x1="540" y1="250" x2="900" y2="340" stroke="#6b5a30" stroke-width="3"/>

  <!-- reach dividers -->
  <g stroke="#555" stroke-dasharray="4 3">
    <line x1="630" y1="242.5" x2="630" y2="272.5"/>
    <line x1="720" y1="265" x2="720" y2="295"/>
    <line x1="810" y1="287.5" x2="810" y2="317.5"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333">
    <text x="585" y="221">reach 1</text>
    <text x="675" y="244">reach 2</text>
    <text x="765" y="266">reach 3</text>
    <text x="855" y="289">reach N</text>
  </g>

  <!-- length L -->
  <line x1="540" y1="190" x2="900" y2="190" stroke="#222" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="540" y1="183" x2="540" y2="250" stroke="#222" stroke-dasharray="3 3"/>
  <line x1="900" y1="183" x2="900" y2="310" stroke="#222" stroke-dasharray="3 3"/>
  <text x="720" y="182" text-anchor="middle">L = total length (MANNING_LENGTH_M), N_REACHES equal reaches</text>

  <!-- flow arrow -->
  <line x1="545" y1="150" x2="625" y2="150" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <text x="635" y="155">flow Q</text>

  <!-- elevation drop -->
  <line x1="540" y1="250" x2="915" y2="250" stroke="#c0392b" stroke-dasharray="5 3"/>
  <line x1="912" y1="250" x2="912" y2="340" stroke="#c0392b" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="924" y="300" fill="#c0392b">ΔE</text>
  <text x="532" y="254" text-anchor="end" font-size="12">E_up</text>

  <!-- slope label -->
  <text x="720" y="362" text-anchor="middle" font-weight="bold">S = ΔE / L = (E_up − E_down) / L   (MANNING_SLOPE)</text>

  <!-- ================= BOTTOM: EQUATIONS ================= -->
  <line x1="20" y1="440" x2="940" y2="440" stroke="#bbb"/>
  <text x="480" y="460" text-anchor="middle">v = (1/n) · R^(2/3) · √S      Q = A · v      n = Manning roughness (MANNING_ROUGHNESS_N)</text>
</svg>
